<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site De Testes</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
        font-family: Arial, sans-serif;
      }

      .message {
        font-size: clamp(4rem, 12vw, 12rem);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="message">Site de Testes MBJ</div>
    <hr>
    <p>Este é um site de testes para desenvolvimento e demonstração de funcionalidades.</p>
    <p>Você pode adicionar mais conteúdo e recursos conforme necessário.</p>
  </body>
</html>
